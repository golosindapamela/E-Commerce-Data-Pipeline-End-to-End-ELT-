name: 'dbt_analytics'
version: '1.0.0'
config-version: 2

profile: 'olist_profile'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  dbt_analytics:
    # Staging Layer: Cleaning and renaming raw tables
    staging:
      +materialized: view
      +schema: raw
    
    # Marts Layer: Dimensional modeling (Star Schema) 
    marts:
      +materialized: table
      +schema: analytics