version: 2

models:
  - name: fct_sales
    description: "The central fact table for Olist sales. Grain: one row per order item."
    columns:
      - name: order_id
        description: "Degenerate dimension identifying the transaction."
        tests:
          - not_null
      - name: product_id
        description: "FK to dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        description: "FK to dim_sellers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: customer_id
        description: "FK to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_date_key
        description: "FK to dim_date (YYYY-MM-DD)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: price
        description: "Unit price of the product."
      - name: freight_value
        description: "Freight value for the item."
      - name: total_item_value
        description: "Calculated as price + freight_value."
        tests:
          - not_null
      - name: total_order_value
        description: "Sum of all total_item_value for a specific order_id."
      - name: order_status
        description: "Current status of the order (delivered, canceled, etc.)."
      - name: actual_delivery_time
        description: "Calculated time difference between purchase and delivery."
      - name: avg_review_score
        description: "Average review score assigned to the order."
      - name: max_installments
        description: "The highest number of payment installments for the order."
      - name: order_purchase_at
        description: "Timestamp of when the order was placed."
      - name: order_delivered_customer_at
        description: "Timestamp of when the customer received the item."
      - name: actual_delivery_time
        description: "Calculated lead time using the age() function."

  - name: dim_products
    description: "Product attributes and physical specifications."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: category_name
        description: "English category name."
      - name: product_category_name_pt
        description: "Original Portuguese category name."
      - name: product_weight_g
        description: "Weight in grams."
      - name: product_length_cm
        description: "Length in centimeters."
      - name: product_height_cm
        description: "Height in centimeters."
      - name: product_width_cm
        description: "Width in centimeters."
      - name: product_photos_count
        description: "Count of photos for the product."
      - name: product_name_length
        description: "Length of the product name."
      - name: product_description_length
        description: "Length of the product description."

  - name: dim_sellers
    description: "Seller identification and geographic location."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: "Seller's zip code prefix."
      - name: seller_city
        description: "Seller's city."
      - name: seller_state
        description: "Seller's state."
      - name: geolocation_lat
        description: "Latitude coordinate of the seller."
      - name: geolocation_lng
        description: "Longitude coordinate of the seller."

  - name: dim_customers
    description: "Customer master data and location details."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier for the customer across multiple orders."
      - name: customer_zip_code_prefix
        description: "Customer's zip code prefix."
      - name: customer_city
        description: "Customer's city."
      - name: customer_state
        description: "Customer's state."
      - name: geolocation_lat
        description: "Latitude coordinate of the customer."
      - name: geolocation_lng
        description: "Longitude coordinate of the customer."

  - name: dim_date
    description: "Date dimension for granular time analysis."
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
      - name: date_year
        description: "Calendar year."
      - name: date_month
        description: "Numeric month."
      - name: date_quarter
        description: "Calendar quarter (1-4)."
      - name: month_name
        description: "Full name of the month."
      - name: day_name
        description: "Full name of the day (e.g., Monday)."
      - name: is_weekend
        description: "Boolean flag (True/False)."
      - name: date_day_of_month
        description: "numeric day within a month (1-31)."