version: 2

models:
  - name: fct_sales
    description: "The central fact table for Olist sales, recorded at the grain of one row per order item. Integrates transaction, logistics, and satisfaction metrics."
    columns:
      - name: order_id
        description: "Degenerate dimension identifying the unique transaction."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key linking to dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: customer_id
        description: "Foreign key linking to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: seller_id
        description: "Foreign key linking to dim_sellers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: order_date_key
        description: "Foreign key linking to dim_date (YYYY-MM-DD)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: total_item_value
        description: "Calculated as price + freight_value."
        tests:
          - not_null

  - name: dim_customers
    description: "Dimension table containing unique customer attributes and geographic details."
    columns:
      - name: customer_id
        description: "Primary key for the customer dimension."
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product dimension enriched with English category translations and physical specifications."
    columns:
      - name: product_id
        description: "Primary key for the product dimension."
        tests:
          - unique
          - not_null

  - name: dim_sellers
    description: "Seller dimension containing location data and coordinates."
    columns:
      - name: seller_id
        description: "Primary key for the seller dimension."
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Daily date dimension for temporal analysis and reporting."
    columns:
      - name: date_day
        description: "Primary key for the date dimension (Date format)."
        tests:
          - unique
          - not_null